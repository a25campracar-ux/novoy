name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar todas las pruebas
        run: node tests/run.js

  alta-en-navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright (solo para esta prueba; la web no tiene dependencias)
        run: npm install --no-save --no-package-lock playwright@1
      - name: Festivos locales con los datos abiertos reales (informativo)
        continue-on-error: true
        run: node scripts/comprobar-festivos.mjs
      - name: Recorrer el alta en Chrome
        run: node scripts/e2e-alta.mjs capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-alta
          path: capturas
